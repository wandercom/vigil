[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.1.0"
description = "Sub-threshold anomaly detection for the Exemplar stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeremy McEntire", email = "jandrewmcentire@gmail.com" }]
keywords = ["anomaly-detection", "observability", "exemplar-stack"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.6",
  "click>=8.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "freezegun>=1.4",
  "ruff>=0.4",
]

[project.scripts]
vigil = "vigil.cli:cli"

[project.urls]
Homepage = "https://github.com/wandercom/vigil"
Issues = "https://github.com/wandercom/vigil/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: function calls in argument defaults — FastAPI's Depends/Query/Path use this idiomatically.
ignore = ["E501", "B008"]
